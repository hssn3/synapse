/* اعمال تم/ترجیحات پیش از رنگ‌آمیزی صفحه تا پرش رنگ (FOUC) رخ ندهد — طبق بخش ۴ مگاپرامپت */
(function(){try{
  var s=JSON.parse(localStorage.getItem('p_visual_prefs')||'{}');
  var d=document.documentElement;
  // تمِ روشن سراسری از پنل سوپرادمین کنترل می‌شود و پیش‌فرضش خاموش است (همیشه
  // تمِ تیره). آخرین مقدارِ واقعیِ سرور که در boot() خوانده شده اینجا کش می‌شود
  // تا حتی همین رندر اول (پیش از رسیدن پاسخ سرور) هم روشنش نکند.
  // خواستهٔ صریح کارفرما: تمِ روشن حذف شد — همیشه تیرهٔ کلاسیک می‌مانیم.
  // هیچ شاخهٔ «روشن» (نه از ترجیح کاربر، نه از تم سیستم) باقی نمی‌ماند.
  d.setAttribute('data-theme','dark');
  if(s.anim==='off'||window.matchMedia('(prefers-reduced-motion: reduce)').matches) d.setAttribute('data-anim','off');
  if(s.snap==='on') d.setAttribute('data-snap','on');
  if(s.shine!=null) d.style.setProperty('--shine-i', s.shine/100);
  if(s.speed!=null) d.style.setProperty('--bg-speed', s.speed/100);
  if(s.glow!=null)  d.style.setProperty('--glow-i', s.glow/100);
  if('scrollRestoration' in history) history.scrollRestoration='manual';
  window.scrollTo(0,0);
}catch(e){}})();
</script>
