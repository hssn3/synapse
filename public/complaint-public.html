<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>انتقادات، پیشنهادها و تقدیر</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/public-form.css">
<script src="/js/public-letterhead.js"></script>
<script src="/js/public-chrome.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="pub-letterhead" id="pubLetterhead"></div>
    <div class="pubtop">
      <h1>انتقادات، پیشنهادها و تقدیر</h1>
      <a class="closebtn" id="closeTop" href="/">✕ بستن</a>
    </div>
    <div class="sub">این فرم عمومی است و نیاز به ورود ندارد. اگر مایل به پیگیری هستید، اطلاعات تماس خود را وارد کنید؛
      در غیر این صورت ثبت به‌صورت ناشناس انجام می‌شود.</div>
    <form id="f">
      <label class="req">نوع</label>
      <select name="type" required>
        <option value="complaint">شکایت / انتقاد</option>
        <option value="suggestion">پیشنهاد</option>
        <option value="compliment">تقدیر و تشکر</option>
      </select>
      <label class="req">متن</label>
      <textarea name="content" required placeholder="موضوع، بخش مربوطه و شرح کامل"></textarea>
      <label>اطلاعات تماس (اختیاری — برای پیگیری)</label>
      <input name="submitter_contact" maxlength="160" placeholder="شماره تماس یا رایانامه">
      <button type="submit" id="sb">ثبت</button>
    </form>
    <div class="msg" id="msg"></div>
    <a class="backlink" id="back" href="#">◂ سایر خدمات همگانی این بیمارستان</a>
  </div>
</div>
<script>
// شناسه بیمارستان از مسیر تمیز /public/complaint/:hospital_id یا از ?hospital=<id>
(function(){
  var m = location.pathname.match(/\/public\/complaint\/([^/?#]+)/);
  var hospital = m ? decodeURIComponent(m[1]) : new URLSearchParams(location.search).get('hospital');
  var msg = document.getElementById('msg'), btn = document.getElementById('sb');
  function show(cls, text){ msg.className = 'msg ' + cls; msg.textContent = text; }
  function showHtml(cls, html){ msg.className = 'msg ' + cls; msg.innerHTML = html; }
  if (!hospital) show('err', 'شناسه بیمارستان در نشانی صفحه وجود ندارد. لطفاً از لینک/کد QR رسمی بیمارستان استفاده کنید.');
  else {
    var backHref = '/?hospital=' + encodeURIComponent(hospital);
    document.getElementById('back').href = backHref;
    document.getElementById('closeTop').href = backHref;
  }
  initPubLetterhead(hospital);

  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    if (!hospital) return;
    var body = { hospital_id: hospital };
    new FormData(e.target).forEach(function(v, k){ body[k] = String(v).trim(); });
    // اگر تماسی داده نشده باشد، ثبت ناشناس است
    body.is_anonymous = !body.submitter_contact;
    btn.disabled = true;
    fetch('/api/public/complaint', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if (!res.ok) { show('err', res.d.error || 'خطا در ثبت'); btn.disabled = false; return; }
        e.target.style.display = 'none';
        showHtml('ok', 'مورد شما ثبت شد. سپاسگزاریم.' +
          '<br><a class="backbtn" href="' + (hospital ? '/?hospital=' + encodeURIComponent(hospital) : '/') + '">بازگشت به خدمات ›</a>');
      })
      .catch(function(){ show('err', 'ارتباط با سرور برقرار نشد'); btn.disabled = false; });
  });
})();
</script>
</body>
</html>
