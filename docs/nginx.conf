# =====================================================================
# nginx.conf — پروکسی معکوس برای سامانه بیمارستانی (سرویس app در docker-compose)
# ---------------------------------------------------------------------
# چرا این فایل لازم شد: docker-compose.yml سرویس nginx را داشت که این فایل را
# به /etc/nginx/conf.d/default.conf مانت می‌کرد، ولی خودِ فایل هیچ‌وقت به مخزن
# نیامده بود — با `docker compose up` سرویس nginx بالا نمی‌آمد (ممیزی ۱۴۰۵-۰۷-۲۰).
#
# طرح امن پیش‌فرض: فقط HTTP روی پورت ۸۰ و پروکسی به اپ. بخش HTTPS/443 عمداً
# کامنت شده تا نبودِ گواهی باعث خطای بالا نیامدن کانتینر نشود؛ پس از نصب
# گواهی (certbot) فقط بلوک زیر را از کامنت خارج کنید و مسیر/دامنه را بگذارید.
#
# نکته‌ی مهم: هدرهای X-Forwarded-* حتماً باید پاس شوند — اپ از
# x-forwarded-proto === 'https' برای کوکی Secure و تشخیص HTTPS استفاده می‌کند.
# =====================================================================

server {
    listen 80;
    server_name _;

    # محدودیت حجم آپلود (هماهنگ با MAX_UPLOAD_SIZE_MB؛ کمی بالاتر برای سرباری فرم)
    client_max_body_size 8m;

    # فایل‌های استاتیک را خودِ nginx مستقیم سرو نکند — اپ (Express.static) سرو می‌کند
    # تا کنترل کش و نسخه‌بندی (?v=...) یکجا بماند. همه به اپ پروکسی می‌شود.
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # هدرهای استاندارد پروکسی
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket/keep-alive (برای SSE یا اتصالات طولانی آینده)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # سلامت‌سنجی سبک برای مانیتورینگ
    location = /healthz {
        proxy_pass http://app:3000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }
}

