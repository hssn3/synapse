# =====================================================================
# nginx-systemd.conf — کانفیگ زندهٔ پروکسی معکوس روی سرور اوبونتو (systemd)
# ---------------------------------------------------------------------
# چرا این فایل اضافه شد (۱۴۰۵/۰۷/۲۴): مالک خواست اپ «بدون پورت» بالا بیاید
# تا پشت دامنهٔ کلادفلر/آروان‌کلود قرار بگیرد و بدون شماره‌پورت قابل مرور باشد.
# نسخهٔ قبلی (docs/nginx.conf) مخصوص داکر بود (proxy_pass http://app:3000)؛
# این نسخه برای سرویس systemd روی 127.0.0.1:3311 است و همین الآن روی سرور
# در /etc/nginx/sites-available/synapse قرار دارد (لینک‌شده در sites-enabled).
#
# نکتهٔ حیاتی: هدرهای X-Forwarded-* حتماً پاس شوند — app.js با trust proxy
# فعال، از x-forwarded-proto برای کوکی Secure و تشخیص HTTPS استفاده می‌کند.
#
# HTTPS: در لبهٔ CDN خاتمه می‌یابد (حالت Flexible/بدون رمزنگاری مبدأ).
# اگر بعداً گواهی روی خود سرور خواستید، بلوک 443 را با certbot اضافه کنید.
# =====================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # upload limit (aligned with MAX_UPLOAD_SIZE_MB plus form overhead)
    client_max_body_size 8m;

    # gzip for text assets (skipped automatically if upstream already compressed)
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3311;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket/keep-alive upgrade pass-through
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # lightweight health endpoint for monitoring
    location = /healthz {
        proxy_pass http://127.0.0.1:3311/healthz;
        proxy_set_header Host $host;
        access_log off;
    }
}
