# =====================================================================
# ساخت و انتشار ایمیج داکر (۱۴۰۵/۰۸/۱۶ — استقرار روی اروان‌کلاد)
#
# چرا این workflow:
# پنل اروان‌کلاد (PaaS) اپ را فقط از «ایمیج کانتینر» بالا می‌آورد و در آن پنل
# امکان بیلد از سورس نیست. ماشین توسعه هم ویندوز است و موتور داکر ندارد.
# پس بیلد در GitHub Actions انجام می‌شود و خروجی روی GHCR منتشر می‌شود تا اروان
# همان ایمیج آماده را pull کند.
#
# نکته‌ها:
#   - پلتفرم صریحاً linux/amd64 است (نودهای اروان amd64 هستند).
#   - کش لایه‌ها در GitHub Actions نگه‌داری می‌شود؛ بیلدهای بعدی چند دقیقه سریع‌ترند.
#   - فقط آماده‌سازیِ ایمیج است؛ هیچ رازی در این فایل نیست (GITHUB_TOKEN خودکار).
#   - تغییرات فقط-مستندات باعث بیلد دوباره نمی‌شوند.
# =====================================================================
name: Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push (ghcr.io)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
