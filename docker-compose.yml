version: '3.8'

# این پروژه از better-sqlite3 (SQLite تک‌فایلی) استفاده می‌کند، نه PostgreSQL — پس هیچ سرویس
# دیتابیس جداگانه‌ای لازم نیست. فایل database/hospital.db روی یک Volume نگه‌داری می‌شود تا با
# recreate کردن کانتینر از بین نرود. مقادیر env زیر باید دقیقاً با .env.example هم‌خوان بمانند.
services:
  app:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      # ⚠️ حتماً قبل از اجرای واقعی جایگزین کنید — با:
      # node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      # توجه: این پلیس‌هولدر از ۱۴۰۵-۰۷-۲۰ در لیست مقادیر ضعیف است و در NODE_ENV=production
      # باعث توقف عمدی سرور می‌شود تا استقرار با یک راز عمومیِ معلوم بالا نیاید.
      JWT_SECRET: change_this_to_a_random_long_string_at_least_32_chars
      JWT_EXPIRES_IN: 8h
      SESSION_COOKIE_NAME: sid
      SUPER_SESSION_COOKIE_NAME: ssid
      PREVIEW_COOKIE_NAME: pvid
      BCRYPT_ROUNDS: 12
      LOGIN_RATE_LIMIT_MAX: 5
      RATE_LIMIT_MAX: 2000
      RATE_LIMIT_WINDOW_MS: 900000
      PUBLIC_FORM_RATE_LIMIT_MAX: 60
      MAX_UPLOAD_SIZE_MB: 5
      UPLOAD_DIR: ./uploads
      BACKUP_DIR: ./backups
      BACKUP_RETENTION_DAYS: 30
      AUTO_BACKUP_KEEP_COUNT: 1
      DEFAULT_HOSPITAL_NAME: بیمارستان نمونه
    ports:
      - "3000:3000"
    volumes:
      - dbdata:/app/database
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot:/etc/letsencrypt:ro

volumes:
  dbdata:
