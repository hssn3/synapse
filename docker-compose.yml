version: '3.8'

# این پروژه از better-sqlite3 (SQLite تک‌فایلی) استفاده می‌کند، نه PostgreSQL — پس هیچ سرویس
# دیتابیس جداگانه‌ای لازم نیست. فایل database/hospital.db روی یک Volume نگه‌داری می‌شود تا با
# recreate کردن کانتینر از بین نرود. مقادیر env زیر باید دقیقاً با .env.example هم‌خوان بمانند.
services:
  app:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      # ⚠️ راز نشست از محیط می‌آید و در این فایل هیچ مقدار پیش‌فرضی ندارد.
      # نبودن JWT_SECRET باعث می‌شود docker compose پیش از بالا آوردن سرویس با پیام
      # «JWT_SECRET is required - see docs/DEPLOYMENT-CHECKLIST.md step A1» رد شود؛
      # پس استقرار با یک راز عمومی/پلیس‌هولدر از همان ابتدا ممکن نیست.
      # چرا: پلیس‌هولدر قبلی همین فایل، در WEAK_JWT_SECRETS داخل src/config/app.js هست؛
      # یعنی مسیر مستندشدهٔ compose در NODE_ENV=production محکوم به توقف عمدی بود (ممیزی ۱۴۰۵/۰۷/۲۳).
      # تولید راز: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      # مقدار در .env کنار همین فایل (در گیت نیست) یا در محیط سرور نگه داشته شود.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - see docs/DEPLOYMENT-CHECKLIST.md step A1}"
      JWT_EXPIRES_IN: 8h
      SESSION_COOKIE_NAME: sid
      SUPER_SESSION_COOKIE_NAME: ssid
      PREVIEW_COOKIE_NAME: pvid
      BCRYPT_ROUNDS: 12
      LOGIN_RATE_LIMIT_MAX: 5
      RATE_LIMIT_MAX: 2000
      RATE_LIMIT_WINDOW_MS: 900000
      PUBLIC_FORM_RATE_LIMIT_MAX: 60
      MAX_UPLOAD_SIZE_MB: 5
      UPLOAD_DIR: ./uploads
      BACKUP_DIR: ./backups
      BACKUP_RETENTION_DAYS: 30
      AUTO_BACKUP_KEEP_COUNT: 1
      DEFAULT_HOSPITAL_NAME: بیمارستان نمونه
    ports:
      - "3000:3000"
    volumes:
      - dbdata:/app/database
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot:/etc/letsencrypt:ro

volumes:
  dbdata:
